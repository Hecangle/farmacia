<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Farmacia</title>
  <link rel="icon" type="image/x-icon" href="img/icono.ico">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #e0f2fe;
      background-image: 
        linear-gradient(135deg, rgba(240, 249, 255, 0.55) 0%, rgba(255, 255, 255, 0.40) 50%, rgba(224, 242, 254, 0.50) 100%),
        url('img/fondo.png');
      background-position: center bottom;
      background-size: cover;
      background-attachment: fixed;
      background-repeat: no-repeat;
      padding: 1.5rem;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 100%;
      max-width: 450px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(2, 132, 199, 0.25), 0 10px 20px -5px rgba(0, 0, 0, 0.08);
      border: 1.5px solid #cbd5e1;
      padding: 2.75rem 2.25rem;
      text-align: center;
    }
    .login-brand-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, #10b981, #047857);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 10px 22px rgba(5, 150, 105, 0.35);
    }
    .login-brand-icon svg {
      width: 38px;
      height: 38px;
      fill: currentColor;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-brand-icon">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor">
      <path d="M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z"/>
    </svg>
  </div>

  <h2 id="login_nombre_farmacia" style="font-size: 1.75rem; font-weight: 900; color: #020617; margin-bottom: 0.35rem;">
    Farmacia
  </h2>
  <p style="color: #1e293b; font-size: 1.05rem; font-weight: 550; margin-bottom: 1.85rem;">
    Ingrese sus credenciales para acceder al sistema
  </p>

  <div id="login_error" class="alert-box alert-danger" style="display: none; text-align: left; margin-bottom: 1.25rem;">
    <span id="login_error_texto">⚠️ Error</span>
  </div>

  <div id="login_db_loading" style="display: block; margin-bottom: 1rem; color: #0369a1; font-weight: 700; font-size: 0.95rem;">
    ⏳ Inicializando motor SQLite...
  </div>

  <form id="form_login" style="text-align: left; display: none;" onsubmit="manejarLogin(event)">
    <div class="form-group">
      <label class="form-label" for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Ej: admin" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Contraseña</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>

    <button type="submit" id="btn_login" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1.05rem; margin-top: 0.5rem;">
      Iniciar Sesión
    </button>
  </form>
</div>

<!-- Scripts SQLite y Lógica de Login -->
<script src="libs/sql-wasm.js"></script>
<script src="libs/sql-wasm-binary.js"></script>
<script src="libs/initial-db.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
